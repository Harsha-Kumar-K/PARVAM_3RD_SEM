<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: brown;
            color:white;
            text-align: center;
            margin: 40px;
            margin-top: 50px;
            margin-bottom: 80px;
            margin-right: 20px;
            margin-left: 30px;
            border: 2px solid black;
            padding: 30px;
            padding-left:20px ;
            padding-right:30px ;
            padding-top:10px ;
            padding-bottom:40px ;
        }
        h2{
            background-color:yellow;
            color:red;
            text-align: center;
            margin: 30px;
            /short hand property/
            /* margin:top right bottom left; */
            margin : 20px 30px 40px 50px;
            border: 3px dashed chocolate;
            padding: 10px;
            text-decoration: underline;
            /short hand property/
            /* padding:top right bottom left; */
            padding : 20px 30px 40px 50px;
        }
    </style>
</head>
<body>
    <h1>This is first heading</h1>
    <h2>This is second heading</h2>
    <h3>This is third heading</h2>
</body>
</html>
<!-- shorthand for margin 
1)one value-all sides
2)two values-opposite sides
3)three values-top,right-left,bottom
4)four values-top,right,bottom,left -->
