<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Two types of lists
    1. ordered list(ol)
    2. unordered list(ul) -->
    <ol>
        <li>Item:1</li>
        <li>Item:2</li>
        <li>Item:3</li>
    </ol>
    <!--
    ol Types
    1.Default-1,2,3,
    2.Alphabets-(a,A)
    3.Roman Numbers-(i,I)-->
    <ol type="I">
        <li>Item:1</li>
        <li>Item:2</li>
        <li>Item:3</li>
    </ol>
    <ul>
        <li>Item:1</li>
        <li>Item:2</li>
        <li>Item:3</li>
    </ul>
     <!--
    ul Types
    1.circle
    2.square
    3.none-->
     <ul type="square">
        <li>Item:1</li>
        <li>Item:2</li>
        <li>Item:3</li>
    </ul>
    <ul>
        <li>MILK PRODUCTS</li>
        <ol>
            <li>ghee</li>
            <li>chesse</li>
            <li>butter</li>
            <li>paneer</li>
        </ol>
        <li>BISCUITS</li>
        <ol>
            <li>hide n seek</li>
            <li>good day</li>
            <li>parle g</li>
            <li>bourbone</li>
        </ol>
    </ul>
    
</body>
</html>
